services:
    pgsql:
        container_name: pgsql
        image: 'postgres'
        ports:
            - '${DB1_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB1_PASSWORD:-secret}'
            POSTGRES_DB: '${DB1_DATABASE}'
            POSTGRES_USER: '${DB1_USER}'
            POSTGRES_PASSWORD: '${DB1_PASSWORD:-secret}'
        volumes:
            - ./.docker/postgresql/data:/var/lib/postgresql